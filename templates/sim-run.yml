# rFabric sim run: runs rFabric simulation suites, one suite or a definition directory's, against
# a candidate image or artifact and gates the pipeline on the verdict. Include it from the
# floating minor tag (v0.1 moves to each release of 0.1), or from an exact release (v0.1.10) to
# pin it:
#
#   include:
#     - remote: https://raw.githubusercontent.com/rfabric/cli/v0.1/templates/sim-run.yml
#       inputs:
#         dir: eval
#         image: $CI_REGISTRY_IMAGE/controller@sha256:...
#         client-id: rf_svc_...
#
# With dir, a merge request pipeline runs the apply preview (problems fail the job), the
# approved suites (blocking) and, when the merge request changes a definition, a test run that
# never fails the job; a pipeline on base-branch applies the directory, then runs its suites.
#
# Secretless: the job's identity token RFABRIC_ID_TOKEN (audience: the audience input, equal to
# the trust's audience) is exchanged by the CLI. client-id signs in on every pipeline but a merge
# request's when pull-request-client-id is set: give merge requests a credential that cannot
# publish. A project CI/CD variable overrides the job variable of the same name, so a CI/CD
# variable RFABRIC_PULL_REQUEST_CLIENT_ID reaches the job without the input; never pass the
# input as $RFABRIC_PULL_REQUEST_CLIENT_ID, which GitLab keeps as that text when it is unset.
# client-secret is only for a credential without a trust; pass a masked CI/CD variable
# (client-secret: $RFABRIC_SECRET), never the secret itself.
# A merge request note per suite or definition directory is written when the
# RFABRIC_GITLAB_TOKEN CI/CD variable holds a token with the api scope.
spec:
  inputs:
    suite:
      description: Sim suite slug, slug@version or id. Set this or dir.
      default: ""
    dir:
      description: "Definition directory (e.g. eval): runs its approved suites, with the apply preview and test run on a merge request and the apply on base-branch. Set this or suite."
      default: ""
    suites:
      description: "With dir: suite slugs to run, comma or newline separated (default: every approved suite)."
      default: ""
    tags:
      description: "With dir: run only the suites carrying any of these tags, comma or newline separated."
      default: ""
    base-branch:
      description: "Branch whose pipelines apply dir and whose passing jobs baseline auto reads (default: the project's default branch)."
      default: ""
    test-run:
      description: "With dir, on a merge request that changes a definition: auto test-runs the changed suites (reported as not yet approved, never fails the job); false skips the test run."
      default: auto
      options: [auto, "false"]
    image:
      description: Candidate image <repository>@sha256:<digest>, registered with `rfabric artifact-build register`. Set this or candidate.
      default: ""
    candidate:
      description: Candidate artifact id instead of image.
      default: ""
    weights:
      description: Weights directory or archive registered with image.
      default: ""
    model:
      description: "Model id for registration (default: created or reused by name)."
      default: ""
    model-name:
      description: "Model name for registration (default: last path segment of the image repository)."
      default: ""
    baseline:
      description: "Baseline subject id, or auto: on base-branch run without one and designate each passing job as its protocol's standing baseline; elsewhere compare with the designated job's subject."
      default: ""
    cells:
      description: "Evaluation cell ids, comma or newline separated (default: the suite matrix)."
      default: ""
    pool:
      description: "Compute pool id (default: the suite's pool)."
      default: ""
    max-worker-hours:
      description: Launch budget, worker hours (set all three budget inputs or none).
      default: ""
    max-parallel-gpu:
      description: Launch budget, GPU attempts running at once.
      default: ""
    max-parallel-cpu:
      description: Launch budget, CPU attempts running at once.
      default: ""
    wall-deadline:
      description: Seconds the job may run; also bounds the wait.
      default: "7200"
    workspace:
      description: "Workspace id (default: the credential's workspace)."
      default: ""
    profile:
      description: CLI profile (production, staging, dev).
      default: production
    api-url:
      description: Explicit API URL instead of profile.
      default: ""
    auth-url:
      description: Explicit auth URL instead of profile.
      default: ""
    client-id:
      description: Service credential client id, used on every pipeline but a merge request's when pull-request-client-id is set.
    pull-request-client-id:
      description: "Service credential client id used on merge request pipelines: a credential that trusts merge requests and cannot publish (default: client-id)."
      default: ""
    client-secret:
      description: Secret, only for a credential without a trust (a masked CI/CD variable reference).
      default: ""
    cli-version:
      description: CLI version, the tag of the job image.
      default: "0.1.15"
    audience:
      description: Audience of the job's identity token; equal to the trust's audience (the auth issuer of the target environment).
      default: https://auth.rfabric.io
    stage:
      description: Pipeline stage of the job.
      default: test
---
rfabric-sim-run:
  stage: $[[ inputs.stage ]]
  image:
    name: ghcr.io/rfabric/cli:$[[ inputs.cli-version ]]
    entrypoint: [""]
  id_tokens:
    RFABRIC_ID_TOKEN:
      aud: $[[ inputs.audience ]]
  variables:
    RFABRIC_SUITE: $[[ inputs.suite ]]
    RFABRIC_DIR: $[[ inputs.dir ]]
    RFABRIC_SUITES: $[[ inputs.suites ]]
    RFABRIC_TAGS: $[[ inputs.tags ]]
    RFABRIC_BASE_BRANCH: $[[ inputs.base-branch ]]
    RFABRIC_TEST_RUN: $[[ inputs.test-run ]]
    RFABRIC_IMAGE: $[[ inputs.image ]]
    RFABRIC_CANDIDATE: $[[ inputs.candidate ]]
    RFABRIC_WEIGHTS: $[[ inputs.weights ]]
    RFABRIC_MODEL: $[[ inputs.model ]]
    RFABRIC_MODEL_NAME: $[[ inputs.model-name ]]
    RFABRIC_BASELINE: $[[ inputs.baseline ]]
    RFABRIC_CELLS: $[[ inputs.cells ]]
    RFABRIC_POOL: $[[ inputs.pool ]]
    RFABRIC_MAX_WORKER_HOURS: $[[ inputs.max-worker-hours ]]
    RFABRIC_MAX_PARALLEL_GPU: $[[ inputs.max-parallel-gpu ]]
    RFABRIC_MAX_PARALLEL_CPU: $[[ inputs.max-parallel-cpu ]]
    RFABRIC_WALL_DEADLINE: $[[ inputs.wall-deadline ]]
    RFABRIC_WORKSPACE: $[[ inputs.workspace ]]
    RFABRIC_PROFILE: $[[ inputs.profile ]]
    RFABRIC_API_URL: $[[ inputs.api-url ]]
    RFABRIC_AUTH_URL: $[[ inputs.auth-url ]]
    RFABRIC_CLIENT_ID: $[[ inputs.client-id ]]
    RFABRIC_PULL_REQUEST_CLIENT_ID: $[[ inputs.pull-request-client-id ]]
    RFABRIC_CLIENT_SECRET: $[[ inputs.client-secret ]]
  script:
    - /opt/rfabric/scripts/gitlab.sh run
  # Runs after a cancel too (CI_JOB_STATUS=canceled): cancels the blocking evaluation jobs,
  # writes the dotenv outputs and the merge request note.
  after_script:
    - /opt/rfabric/scripts/gitlab.sh after
  # JUnit: junit.xml for a suite, <suite slug>.xml per suite of a definition directory.
  # outputs.json also holds the suites output, which dotenv cannot carry.
  artifacts:
    when: always
    paths:
      - rfabric-sim-run/*.xml
      - rfabric-sim-run/*.md
      - rfabric-sim-run/outputs.json
    reports:
      junit: rfabric-sim-run/*.xml
      dotenv: rfabric-sim-run/outputs.env
