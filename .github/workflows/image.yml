# Publishes ghcr.io/rfabric/cli:<version> (linux/amd64, linux/arm64) for each stable
# release v<version> of this repository: the pinned rfabric CLI and the CI wrapper scripts, the
# image of the Bitbucket pipe and of the GitLab template's job. A published version tag is
# never overwritten. Once that image exists, `promote` moves the two floating references of
# the release line, the git tag v<major>.<minor> and the image tag <major>.<minor>, to the
# newest stable patch of the line whose image exists, this release or a newer one
# (scripts/promote.sh <version>).
#
# The jobs push the image with the job token (packages: write); the package is public.
# Repository secret: RELEASE_GITHUB_TOKEN (Contents and Workflows write on this repository)
# pushes the git tag: the job token cannot hold the workflows permission, and GitHub may refuse
# it a tag move to a commit that changes .github/workflows/.
name: image

on:
  release:
    types: [published]

permissions: {}

env:
  IMAGE: ghcr.io/rfabric/cli

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      line: ${{ steps.version.outputs.line }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the version
        id: version
        run: |
          version=${TAG#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$TAG' is not v<major>.<minor>.<patch>"
            exit 1
          fi
          if [ "$(cat VERSION)" != "$version" ]; then
            echo "::error::VERSION is $(cat VERSION), the release is $version: run scripts/set-version.sh before tagging"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "line=${version%.*}" >> "$GITHUB_OUTPUT"

      # The image installs the release's linux binaries; they may still be uploading.
      - name: Wait for the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for _ in $(seq 60); do
            assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if grep -qx "rfabric_${VERSION}_linux_amd64.tar.gz" <<< "$assets" \
              && grep -qx "rfabric_${VERSION}_linux_arm64.tar.gz" <<< "$assets" \
              && grep -qx checksums.txt <<< "$assets"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::release $TAG has no linux binaries after 15 minutes"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Refuse an existing version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: RFABRIC_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true

  # One promotion per release line at a time. GitHub keeps one running and one pending job per
  # concurrency group and cancels the pending one when another queues, so a promotion may be
  # cancelled; every promotion moves the line to its newest patch with an image, so the next
  # one completes it.
  promote:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: promote-v${{ needs.publish.outputs.line }}
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Move v<major>.<minor> and the image tag <major>.<minor>
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: scripts/promote.sh "$VERSION"
