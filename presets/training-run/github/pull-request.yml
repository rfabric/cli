# rFabric training preset: every pull request push. Each push builds the trainer image from the
# pull request's head commit and launches a short CPU training run of a dedicated template in the
# pull request workspace, replacing the run of the previous push. A pull request from a fork is
# skipped: its job gets neither the registry nor the identity token. Copy to .github/workflows/;
# ADAPT marks what to change. Repository variables: TRAINING_PULL_REQUEST_CLIENT_ID (a credential
# of the pull request workspace), TRAINING_PULL_REQUEST_WORKSPACE_ID,
# TRAINING_PULL_REQUEST_EXPERIMENT_ID, TRAINING_PULL_REQUEST_DATASET_VERSIONS.
# Repository secret: RFABRIC_PACKAGES_TOKEN, a GitHub token that reads the private rFabric Python
# packages rfabric/rfabric-candidate, rfabric/rfabric-simulator and rfabric/rfabric-trainer,
# needed when the trainer image installs rfabric-trainer. The build reads it as the BuildKit
# secret github_token: it exists only during the build and never reaches a layer. Unset, the
# build runs without the secret.
name: Train (pull request)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: train-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.repository.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # ghcr.io takes lowercase repository names only.
      - id: repository
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/trainer" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The trainer image, pushed and passed on by digest. ADAPT: context and Dockerfile.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.repository.outputs.name }}:${{ github.event.pull_request.head.sha }}
          secrets: github_token=${{ secrets.RFABRIC_PACKAGES_TOKEN }}

  train:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the identity token the CLI exchanges
      pull-requests: write # the pull request comment
    steps:
      - uses: rfabric/cli/training-run@v0.1
        with:
          launch-template: trainer-pull-request-cpu # ADAPT: the short CPU training template
          experiment: ${{ vars.TRAINING_PULL_REQUEST_EXPERIMENT_ID }}
          dataset-versions: ${{ vars.TRAINING_PULL_REQUEST_DATASET_VERSIONS }}
          workspace: ${{ vars.TRAINING_PULL_REQUEST_WORKSPACE_ID }}
          image: ${{ needs.build.outputs.image }}
          # The commit the image was built from: the pull request's head commit (the build job's checkout).
          code-version: ${{ github.event.pull_request.head.sha }}
          replace-previous: "true"
          client-id: ${{ vars.TRAINING_PULL_REQUEST_CLIENT_ID }}
          pull-request-client-id: ${{ vars.TRAINING_PULL_REQUEST_CLIENT_ID }}
