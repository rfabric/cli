# rFabric training preset: tag push. Pushing a tag train/<name> builds the trainer image from the
# tagged commit and launches a training run on it. Copy to .github/workflows/; ADAPT marks what to
# change. Repository variables: TRAINING_CLIENT_ID, TRAINING_EXPERIMENT_ID,
# TRAINING_DATASET_VERSIONS. Environment gpu-training: its required reviewers approve before GPU
# spend.
# Repository secret: RFABRIC_TRAINER_TOKEN, a GitHub token with read access to
# rfabric/rfabric-trainer, needed when the trainer image installs rfabric-trainer. The build reads
# it as the BuildKit secret github_token: it exists only during the build and never reaches a
# layer. Unset, the build runs without the secret.
name: Train (tag)
on:
  push:
    tags: ["train/*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.repository.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      # ghcr.io takes lowercase repository names only.
      - id: repository
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/trainer" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The trainer image, pushed and passed on by digest. ADAPT: context and Dockerfile.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.repository.outputs.name }}:${{ github.sha }}
          secrets: github_token=${{ secrets.RFABRIC_TRAINER_TOKEN }}

  train:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers on this environment approve the run before GPU spend.
    environment: gpu-training
    permissions:
      contents: read
      id-token: write # the identity token the CLI exchanges
    steps:
      - uses: rfabric/cli/training-run@v0.1
        with:
          launch-template: trainer # ADAPT
          experiment: ${{ vars.TRAINING_EXPERIMENT_ID }}
          dataset-versions: ${{ vars.TRAINING_DATASET_VERSIONS }}
          run-tags: git-tag=${{ github.ref_name }}
          image: ${{ needs.build.outputs.image }}
          # The commit the image was built from: the tagged commit, GITHUB_SHA.
          code-version: ${{ github.sha }}
          client-id: ${{ vars.TRAINING_CLIENT_ID }}
