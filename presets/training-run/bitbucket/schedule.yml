# rFabric training preset: schedule. Add a schedule (Repository settings > Pipelines > Schedules)
# on the base branch running the custom pipeline train-scheduled; it builds the trainer image and
# launches a training run on it. Copy into bitbucket-pipelines.yml; ADAPT marks what to change.
# The commit the image was built from is the scheduled pipeline's commit, BITBUCKET_COMMIT.
# Repository variables: TRAINING_CLIENT_ID, TRAINING_EXPERIMENT_ID, TRAINING_DATASET_VERSIONS,
# DOCKER_USERNAME, DOCKER_PASSWORD.
# Sign-in: a schedule on another branch than the base branch has no base-branch claim, so the
# step declares the deployment environment training and the base-branch credential trusts its
# UUID (deploymentEnvironmentUuid). Create the deployment environment training (Repository
# settings > Deployments), allow only maintainers to deploy to it (Bitbucket Premium custom
# deployment permissions), and copy its UUID, braces included, into the credential trust. Without
# that restriction any branch with a deployment: training step signs in as the base-branch
# credential.
definitions:
  steps:
    - step: &train
        name: Build the trainer and launch a training run
        services: [docker]
        deployment: training
        oidc:
          audiences:
            - https://auth.rfabric.io # ADAPT: the trust's audience
        script:
          # The trainer image, pushed and passed on by digest. ADAPT: registry, repository,
          # Dockerfile; DOCKER_USERNAME and DOCKER_PASSWORD are secured repository variables.
          - export TRAINER_REPOSITORY=docker.io/acme/trainer
          - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin docker.io
          - docker build --file Dockerfile --tag "$TRAINER_REPOSITORY:$BITBUCKET_COMMIT" .
          - docker push "$TRAINER_REPOSITORY:$BITBUCKET_COMMIT"
          - export TRAINER_IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$TRAINER_REPOSITORY:$BITBUCKET_COMMIT")
          - pipe: docker://ghcr.io/rfabric/cli:0.1
            variables:
              RFABRIC_LAUNCH_TEMPLATE: trainer # ADAPT
              RFABRIC_EXPERIMENT: $TRAINING_EXPERIMENT_ID
              RFABRIC_DATASET_VERSIONS: $TRAINING_DATASET_VERSIONS
              RFABRIC_CLIENT_ID: $TRAINING_CLIENT_ID
              RFABRIC_IMAGE: $TRAINER_IMAGE
              RFABRIC_CODE_VERSION: $BITBUCKET_COMMIT

pipelines:
  custom:
    train-scheduled:
      - step: *train
