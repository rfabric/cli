# rFabric training preset: a pull request a maintainer approves for training. Bitbucket has no pull
# request labels: the step is manual, and a maintainer runs it on the pull request's pipeline
# (anyone who can run a manual step: restrict who can push to the repository accordingly). It
# builds the trainer image and launches a short, step-capped training run in the pull request
# workspace, replacing the run of the previous approval. Copy into bitbucket-pipelines.yml; ADAPT
# marks what to change. The commit the image was built from is the pull request pipeline's
# commit, BITBUCKET_COMMIT: the source branch's head.
# Repository variables: TRAINING_PULL_REQUEST_CLIENT_ID (a credential of the pull request
# workspace), TRAINING_PULL_REQUEST_WORKSPACE_ID, TRAINING_PULL_REQUEST_EXPERIMENT_ID,
# TRAINING_PULL_REQUEST_DATASET_VERSIONS, TRAINING_BITBUCKET_TOKEN (optional: the pull request
# comment), DOCKER_USERNAME, DOCKER_PASSWORD.
# Secured repository variable: RFABRIC_TRAINER_TOKEN, a GitHub token with read access to
# rfabric/rfabric-trainer, needed when the trainer image installs rfabric-trainer. The build reads
# it as the BuildKit secret github_token: it exists only during the build and never reaches a
# layer. Unset, the build runs with an empty secret.
definitions:
  steps:
    - step: &train
        name: Build the trainer and launch a short training run
        services: [docker]
        oidc:
          audiences:
            - https://auth.rfabric.io # ADAPT: the trust's audience
        trigger: manual
        script:
          # The trainer image, pushed and passed on by digest. ADAPT: registry, repository,
          # Dockerfile; DOCKER_USERNAME and DOCKER_PASSWORD are secured repository variables.
          # The token file stays outside the build context, so no COPY can put it in a layer.
          - export TRAINER_REPOSITORY=docker.io/acme/trainer
          - export DOCKER_BUILDKIT=1
          - printf '%s' "$RFABRIC_TRAINER_TOKEN" > /tmp/github_token
          - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin docker.io
          - docker build --secret id=github_token,src=/tmp/github_token --file Dockerfile --tag "$TRAINER_REPOSITORY:$BITBUCKET_COMMIT" .
          - docker push "$TRAINER_REPOSITORY:$BITBUCKET_COMMIT"
          - export TRAINER_IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$TRAINER_REPOSITORY:$BITBUCKET_COMMIT")
          - pipe: docker://ghcr.io/rfabric/cli:0.1
            variables:
              RFABRIC_LAUNCH_TEMPLATE: trainer-pull-request # ADAPT: the short, step-capped template
              RFABRIC_EXPERIMENT: $TRAINING_PULL_REQUEST_EXPERIMENT_ID
              RFABRIC_DATASET_VERSIONS: $TRAINING_PULL_REQUEST_DATASET_VERSIONS
              RFABRIC_WORKSPACE: $TRAINING_PULL_REQUEST_WORKSPACE_ID
              RFABRIC_REPLACE_PREVIOUS: "true"
              RFABRIC_CLIENT_ID: $TRAINING_PULL_REQUEST_CLIENT_ID
              RFABRIC_BITBUCKET_TOKEN: $TRAINING_BITBUCKET_TOKEN
              RFABRIC_IMAGE: $TRAINER_IMAGE
              RFABRIC_CODE_VERSION: $BITBUCKET_COMMIT

pipelines:
  pull-requests:
    "**":
      - step: *train
