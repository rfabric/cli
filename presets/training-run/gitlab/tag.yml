# rFabric training preset: tag push. Pushing a tag train/<name> builds the trainer image from the
# tagged commit and launches a training run on it. Copy into .gitlab-ci.yml; ADAPT marks what to
# change. The commit the image was built from is the tagged commit, CI_COMMIT_SHA.
# CI/CD variables: TRAINING_CLIENT_ID, TRAINING_EXPERIMENT_ID, TRAINING_DATASET_VERSIONS (never
# RFABRIC_*: a project variable named like a template input overrides the job variable the
# template sets). Protect the job's GPU spend with a protected environment and deployment
# approvals where your plan has them.
# Masked CI/CD variable: RFABRIC_PACKAGES_TOKEN, a GitHub token that reads the private rFabric
# Python packages rfabric/rfabric-candidate, rfabric/rfabric-simulator and
# rfabric/rfabric-trainer, needed when the trainer image installs rfabric-trainer (no template
# input has that name, so it overrides nothing). The build reads it as the BuildKit secret
# github_token: it exists only during the build and never reaches a layer. Unset, the build runs
# with an empty secret.

stages: [build, train]

include:
  - remote: https://raw.githubusercontent.com/rfabric/cli/v0.1/templates/training-run.yml
    inputs:
      stage: train
      launch-template: trainer # ADAPT
      experiment: $TRAINING_EXPERIMENT_ID
      dataset-versions: $TRAINING_DATASET_VERSIONS
      run-tags: git-tag=$CI_COMMIT_TAG
      code-version: $CI_COMMIT_SHA
      client-id: $TRAINING_CLIENT_ID
      audience: https://auth.rfabric.io # ADAPT: the trust's audience

# The pipelines both jobs run in.
.train:
  rules: &train-rules
    - if: $CI_COMMIT_TAG =~ /^train\//

# The trainer image, pushed and passed on by digest: the dotenv report's RFABRIC_IMAGE takes
# precedence over the template job's variable of the same name. ADAPT: context and Dockerfile.
# The token file stays outside the build context, so no COPY can put it in a layer.
build-trainer:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules: *train-rules
  variables:
    TRAINER_REPOSITORY: $CI_REGISTRY_IMAGE/trainer
  script:
    - printf '%s' "$RFABRIC_PACKAGES_TOKEN" > /tmp/github_token
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --secret id=github_token,src=/tmp/github_token --file Dockerfile --tag "$TRAINER_REPOSITORY:$CI_COMMIT_SHA" .
    - docker push "$TRAINER_REPOSITORY:$CI_COMMIT_SHA"
    - echo "RFABRIC_IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$TRAINER_REPOSITORY:$CI_COMMIT_SHA")" > trainer.env
  artifacts:
    reports:
      dotenv: trainer.env

rfabric-training-run:
  needs: [build-trainer]
  rules: *train-rules
