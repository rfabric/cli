# rFabric training preset: a merge request a maintainer approves for training. While the merge
# request carries the label train (set by a maintainer), each merge request pipeline builds the
# trainer image and launches a short, step-capped training run in the pull request workspace,
# replacing the run of the previous pipeline. Copy into .gitlab-ci.yml; ADAPT marks what to
# change. The commit the image was built from is the merge request pipeline's commit,
# CI_COMMIT_SHA: the source branch's head (in a merged results pipeline, the merge commit).
# CI/CD variables: TRAINING_PULL_REQUEST_CLIENT_ID (a credential of the pull request workspace),
# TRAINING_PULL_REQUEST_WORKSPACE_ID, TRAINING_PULL_REQUEST_EXPERIMENT_ID,
# TRAINING_PULL_REQUEST_DATASET_VERSIONS (never RFABRIC_*: a project variable named like a
# template input overrides the job variable the template sets). Protect the job's GPU spend with
# a protected environment and deployment approvals where your plan has them.
# Masked CI/CD variable: RFABRIC_TRAINER_TOKEN, a GitHub token with read access to
# rfabric/rfabric-trainer, needed when the trainer image installs rfabric-trainer (no template
# input has that name, so it overrides nothing). The build reads it as the BuildKit secret
# github_token: it exists only during the build and never reaches a layer. Unset, the build runs
# with an empty secret.

stages: [build, train]

include:
  - remote: https://raw.githubusercontent.com/rfabric/cli/v0.1/templates/training-run.yml
    inputs:
      stage: train
      launch-template: trainer-pull-request # ADAPT: the short, step-capped template
      experiment: $TRAINING_PULL_REQUEST_EXPERIMENT_ID
      dataset-versions: $TRAINING_PULL_REQUEST_DATASET_VERSIONS
      workspace: $TRAINING_PULL_REQUEST_WORKSPACE_ID
      code-version: $CI_COMMIT_SHA
      replace-previous: "true"
      client-id: $TRAINING_PULL_REQUEST_CLIENT_ID
      audience: https://auth.rfabric.io # ADAPT: the trust's audience

# The pipelines both jobs run in.
.train:
  rules: &train-rules
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)train(,|$)/

# The trainer image, pushed and passed on by digest: the dotenv report's RFABRIC_IMAGE takes
# precedence over the template job's variable of the same name. ADAPT: context and Dockerfile.
# The token file stays outside the build context, so no COPY can put it in a layer.
build-trainer:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules: *train-rules
  variables:
    TRAINER_REPOSITORY: $CI_REGISTRY_IMAGE/trainer
  script:
    - printf '%s' "$RFABRIC_TRAINER_TOKEN" > /tmp/github_token
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --secret id=github_token,src=/tmp/github_token --file Dockerfile --tag "$TRAINER_REPOSITORY:$CI_COMMIT_SHA" .
    - docker push "$TRAINER_REPOSITORY:$CI_COMMIT_SHA"
    - echo "RFABRIC_IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$TRAINER_REPOSITORY:$CI_COMMIT_SHA")" > trainer.env
  artifacts:
    reports:
      dotenv: trainer.env

rfabric-training-run:
  needs: [build-trainer]
  rules: *train-rules
